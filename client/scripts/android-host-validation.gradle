// Compiles the Android native host without copying ArkUI-X SDK binaries into the repository.
// Usage: gradlew -I ../../scripts/android-host-validation.gradle compileDebugJavaWithJavac
def configuredArkUiRoot = System.getenv('ARKUIX_SDK_HOME')
def arkUiRoot = configuredArkUiRoot ?: new File(System.getProperty('user.home'), 'Library/ArkUI-X/Sdk')
def adapterJar = new File(arkUiRoot, '20/arkui-x/engine/lib/arkui/arkui_android_adapter.jar')
def engineRoot = new File(arkUiRoot, '20/arkui-x/engine/lib')

if (!adapterJar.isFile()) {
    throw new GradleException("ArkUI-X Android adapter not found: ${adapterJar}")
}

allprojects {
    afterEvaluate { project ->
        if (project.path == ':app') {
            project.dependencies.add('implementation', project.files(adapterJar))

            // Package the official engine libraries into a generated build directory.
            // Nothing from the vendor SDK is copied into the repository source tree.
            def generatedJni = new File(project.buildDir, 'generated/arkuix-validation-jni')
            def syncArkUiNative = project.tasks.register('syncArkUiNativeForValidation', Sync) {
                from(new File(engineRoot, 'arkui/android-arm64-release')) { into 'arm64-v8a' }
                from(new File(engineRoot, 'utils/android-arm64-release')) { into 'arm64-v8a' }
                from(new File(engineRoot, 'third_party/android-arm64-release')) { into 'arm64-v8a' }
                from(new File(engineRoot, 'arkui/android-arm-release')) { into 'armeabi-v7a' }
                from(new File(engineRoot, 'utils/android-arm-release')) { into 'armeabi-v7a' }
                from(new File(engineRoot, 'third_party/android-arm-release')) { into 'armeabi-v7a' }
                into generatedJni
            }
            project.android.sourceSets.main.jniLibs.srcDir(generatedJni)
            project.tasks.matching { it.name == 'mergeDebugJniLibFolders' }.configureEach {
                dependsOn(syncArkUiNative)
            }
        }
    }
}
