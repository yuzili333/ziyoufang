# Include this file inside the existing HTTPS server block for lilicoconut.me.
# It intentionally owns only /api/v1 paths and leaves the existing website unchanged.
location = /api/v1/health {
  proxy_pass http://127.0.0.1:18080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Request-Id $request_id;
  proxy_set_header Connection "";
  proxy_hide_header X-Powered-By;
  proxy_read_timeout 10s;
  client_max_body_size 1m;
}

location = /api/v1/auth/wechat {
  limit_req zone=ziyoufang_auth_per_ip burst=5 nodelay;
  proxy_pass http://127.0.0.1:18080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Request-Id $request_id;
  proxy_set_header Connection "";
  proxy_hide_header X-Powered-By;
  proxy_read_timeout 30s;
  client_max_body_size 1m;
}

location ^~ /api/v1/ {
  limit_req zone=ziyoufang_api_per_ip burst=30 nodelay;
  proxy_pass http://127.0.0.1:18080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Request-Id $request_id;
  proxy_set_header Connection "";
  proxy_hide_header X-Powered-By;
  proxy_read_timeout 30s;
  client_max_body_size 1m;
}
