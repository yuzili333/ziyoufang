schema_version: 2
source: "../../hanzi.md"

status_legend:
  defined: "业务结果和原型行为已经定义"
  needs_evidence: "行为已定义，但合规、样本或生产阈值仍需证据"

scenarios:
  - id: "SCN-000"
    title: "首次进入与监护人确认"
    status: "needs_evidence"
    actor: "学生与监护人"
    given:
      - "用户首次进入字有方微信小程序"
    when:
      - "用户准备拍照、选择相册或上传练字图片"
    then:
      - "系统先展示图片用途、第三方处理、留存和删除说明"
      - "未完成隐私授权和监护人确认时不上传或持久化练字图片"
      - "拒绝后仍可退出，不进入评测流程"
    covers: ["CAP-00"]

  - id: "SCN-001"
    title: "提交多字书写练习"
    status: "defined"
    actor: "学生"
    given:
      - "学生已输入目标练习文字并完成一页方格练习"
      - "图片处理授权有效"
    when:
      - "学生拍照或从相册选择练字图片"
    then:
      - "系统展示整页图片和目标文字供确认"
      - "图片不满足要求时给出具体重拍原因"
      - "断网时保存为待提交，恢复网络后沿用同一幂等任务继续"
    covers: ["CAP-01"]

  - id: "SCN-002"
    title: "切分并识别多个汉字"
    status: "needs_evidence"
    actor: "系统"
    given:
      - "系统收到可处理的多方格练字图片"
    when:
      - "系统完成质量检查、透视校正、方格切分和 OCR"
    then:
      - "学生看到逐字识别结果、位置和清晰的处理阶段"
      - "低置信或冲突单格标记为不确定，不形成伪确定结论"
      - "部分单格失败时保留可用结果并显示成功、失败和不确定数量"
    covers: ["CAP-02"]

  - id: "SCN-003"
    title: "区分错字与待纠偏字"
    status: "needs_evidence"
    actor: "学生"
    given:
      - "系统已完成 OCR、目标文字对齐和确定性特征计算"
    when:
      - "学生查看单字结果"
    then:
      - "稳定非目标文字显示为错字"
      - "内容正确但结构存在问题时显示为待纠偏"
      - "证据不足时显示不确定，并提供重拍或重写建议"
      - "模型不得单独改变识别字、分类或评分"
    covers: ["CAP-03", "CAP-04", "CAP-05"]

  - id: "SCN-004"
    title: "对比手写字与标准字"
    status: "needs_evidence"
    actor: "学生"
    given:
      - "某个汉字具有有效的纠错或纠偏结果"
    when:
      - "学生在横向单字列表选择该字"
    then:
      - "主视图同时展示手写字、思源宋体参考字形和差异标注"
      - "分数、问题清单和最多三条练习建议与差异证据一致"
      - "标准字、评分、提示词和模型版本可以追溯"
    covers: ["CAP-04", "CAP-05"]

  - id: "SCN-005"
    title: "沉淀问题字并发起矫正"
    status: "defined"
    actor: "学生"
    given:
      - "系统形成有效的错字或待纠偏结论"
    when:
      - "本次评测完成"
    then:
      - "问题字进入“我的—字本”"
      - "不确定和失败单格不得进入字本"
      - "学生可以围绕具体问题字再次拍照练习"
    covers: ["CAP-06"]

  - id: "SCN-006"
    title: "跟踪同一问题字的改进"
    status: "needs_evidence"
    actor: "学生"
    given:
      - "学生曾对同一个问题字进行评测和练习"
    when:
      - "学生再次提交该字"
    then:
      - "系统将新结果加入同一矫正序列"
      - "相同评价版本可比较，不同版本明确标记不可直接比较"
      - "历史退步记录不被最佳成绩覆盖"
    covers: ["CAP-07"]

  - id: "SCN-007"
    title: "反馈结果并重新评测"
    status: "defined"
    actor: "学生"
    given:
      - "学生认为某个识别、分类或评分结果有误"
    when:
      - "学生选择原因并提交结果反馈"
    then:
      - "系统生成关联的新评测版本"
      - "原结果、反馈原因和时间保持不变且可追溯"
      - "新结果完成后按最新有效版本重算字本状态"
    covers: ["CAP-08"]

  - id: "SCN-008"
    title: "生成受控分享卡"
    status: "needs_evidence"
    actor: "监护人"
    given:
      - "评测已完成且存在可分享的结构化摘要"
    when:
      - "监护人查看分享预览并再次确认"
    then:
      - "系统生成不含原图、裁剪图、真实姓名和内部标识的脱敏分享卡"
      - "未确认或确认已撤回时不得访问分享卡"
      - "分享入口不延伸为动态、排行、积分或挑战"
    covers: ["CAP-09"]

  - id: "SCN-009"
    title: "删除练习与撤回授权"
    status: "needs_evidence"
    actor: "学生与监护人"
    given:
      - "用户已有练习、图片、结果或分享卡"
    when:
      - "用户删除练习或撤回图片处理授权"
    then:
      - "系统说明删除影响并要求确认"
      - "私有图片、结果关联和分享访问按批准策略处理"
      - "保留最小必要审计且不继续发起新的第三方处理"
    covers: ["CAP-00", "CAP-09"]

  - id: "SCN-010"
    title: "形成成长曲线并重点监测低分汉字"
    status: "needs_evidence"
    actor: "学生"
    given:
      - "同一学生对同一目标字已有有效练习记录"
    when:
      - "系统完成本次五维字形评价并更新历次记录"
    then:
      - "少于三次可比练习时只显示样本积累进度，不形成稳定性结论"
      - "三次及以上可比练习时展示总分成长曲线、最近三次均分和稳定性"
      - "近三次均分或稳定性低于版本化入库阈值时，该字进入“我的—字本—重点字库”"
      - "评分或标准字版本变化时曲线分段，旧结果不参与新分段稳定性计算"
      - "恢复达标后退出当前重点状态，但历史成绩和入库记录继续保留"
    covers: ["CAP-04", "CAP-07", "CAP-10"]
