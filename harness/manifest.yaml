schema_version: 1

project:
  name: "字有方"
  english_name: "ZiYouFang"
  tagline: "汉字有形，习字有方。"

source_of_truth:
  path: "../hanzi.md"
  language: "zh-CN"

stage:
  id: "implementation-validation"
  status: "active"
  allowed_deliverable: "formal-client-scaffold-and-capability-validation"

gates:
  prototype_review:
    status: "approved"
    record: "reviews/prototype-review-2026-08-07.md"
  technology_selection:
