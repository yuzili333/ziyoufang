schema_version: 2

project:
  name: "字有方"
  english_name: "ZiYouFang"
  tagline: "汉字有形，习字有方。"

source_of_truth:
  path: "../hanzi.md"
  language: "zh-CN"

stage:
  id: "implementation-validation"
  status: "active"
  allowed_deliverable: "formal-miniprogram-cloud-functions-bff-assessment-service-and-validation-evidence"
  prohibited_deliverable: "production-release-or-real-student-data-before-compliance-and-release-gates"

gates:
  visual_source:
    status: "approved"
    record: "prototypes/mobile-v2.md"
  prototype_review:
    status: "approved"
    record: "reviews/prototype-review-mobile-v2.md"
    unblock_when:
      - "visual_source.status == approved"
      - "可点击原型通过视觉与交互验证"
      - "联合评审阻塞项为零"
  prototype_implementation:
    status: "verified"
    record: "../prototype/mobile-v2/design-qa.md"
  pad_information_architecture:
    status: "verified"
    record: "../prototype/mobile-v2/pad-design-qa.md"
  joint_review_packet:
    status: "complete"
    record: "reviews/mobile-v2-joint-review-packet.md"
  technology_selection:
    status: "approved"
    record: "decisions/technology-selection.md"
  assessment_pipeline:
    status: "approved"
    record: "decisions/assessment-pipeline.md"
  provider_adapter_foundation:
    status: "verified-local-mocked"
    record: "validation/provider-adapter-foundation-2026-08-11.md"
  synthetic_assessment_pipeline:
    status: "verified-local-pixel-synthetic"
    record: "validation/synthetic-assessment-pipeline-2026-08-11.md"
  local_visual_evidence_foundation:
    status: "verified-static-local-sandbox"
    record: "validation/local-visual-evidence-foundation-2026-08-11.md"
  mobile_image_ingestion_foundation:
    status: "verified-local-synthetic-jpeg-png"
    record: "validation/mobile-image-ingestion-foundation-2026-08-11.md"
  private_media_handoff_foundation:
    status: "verified-local-mocked"
    record: "validation/private-media-handoff-foundation-2026-08-11.md"
  cell_visual_evidence_foundation:
    status: "verified-local-pixel-synthetic"
    record: "validation/cell-visual-evidence-foundation-2026-08-11.md"
  page_first_ocr_evidence_foundation:
    status: "verified-local-mocked"
    record: "validation/page-first-ocr-evidence-foundation-2026-08-11.md"
  pixel_glyph_feature_foundation:
    status: "verified-local-synthetic-glyph"
    record: "validation/pixel-glyph-feature-foundation-2026-08-11.md"
  assessment_poc:
    status: "blocked"
    record: "validation/assessment-poc-plan.md"
    unblock_when:
      - "prototype_review.status == approved"
      - "仅使用合成、脱敏或有证明的授权样本"
      - "POC 指标目标与评测集清单由产品、算法、测试共同批准"
      - "node harness/bin/check-poc-inputs.mjs --require-ready 通过"
  legacy_client:
    status: "frozen"
    record: "../client/README.md"
    delete_when:
      - "prototype_review.status == approved"
      - "公共契约、Schema 与 fixture 已迁移并通过验证"
  development_scaffold:
    status: "verified"
    record: "validation/vertical-slice-a-2026-08-11.md"
  vertical_slice_a:
    status: "verified"
    record: "validation/vertical-slice-a-2026-08-11.md"
  learning_loop_foundation:
    status: "verified-local-synthetic"
    record: "validation/vertical-slice-cd-foundation-2026-08-11.md"
  mobile_main_flow_foundation:
    status: "verified-local-synthetic"
    record: "validation/mobile-main-flow-foundation-2026-08-11.md"
  feedback_reassessment_foundation:
    status: "verified-local-synthetic"
    record: "validation/feedback-reassessment-foundation-2026-08-11.md"
  privacy_actions_foundation:
    status: "verified-local-synthetic"
    record: "validation/privacy-actions-foundation-2026-08-11.md"
  observability_security_cost_foundation:
    status: "verified-local-synthetic"
    record: "validation/observability-security-cost-foundation-2026-08-11.md"
  responsive_client_foundation:
    status: "verified-static"
    record: "validation/responsive-client-foundation-2026-08-11.md"
  privacy_and_data_compliance:
    status: "pending"
    record: "reviews/privacy-and-data-compliance.md"
  release_readiness:
    status: "blocked"
    unblock_when:
      - "prototype_review.status == approved"
      - "privacy_and_data_compliance.status == approved"
      - "微信三端真机、模型回归、安全与成本门禁通过"

