    record: "decisions/technology-selection.md"
  client_capability_validation:
    status: "in_progress"
    record: "validation/arkui-x-capability-verification.md"
  development_scaffold:
    status: "active"
    record: "../client/README.md"
    authorized_by: "用户明确要求创建正式研发工程并同步开展三端能力验证"
  privacy_and_data_compliance:
    status: "pending"
    record: "reviews/privacy-and-data-compliance.md"
  release_readiness:
    status: "blocked"
    unblock_when:
      - "client_capability_validation.status == approved"
      - "privacy_and_data_compliance.status == approved"

